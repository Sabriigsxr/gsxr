<!-- GSXR LAUNCHCTRL — Monogram (X-LC) / Favicon -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="GSXR LAUNCHCTRL monogram">
  <defs>
    <linearGradient id="blueGradMono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087BFF"/>
      <stop offset="100%" stop-color="#21C8FF"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="16" fill="#080B10"/>
  <!-- X signature with racing bars -->
  <path d="M30,30 L70,70 M70,30 L30,70" stroke="url(#blueGradMono)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Redline accent -->
  <circle cx="80" cy="20" r="4" fill="#FF3048"/>
  <!-- Inner glow ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#21C8FF" stroke-width="1" opacity="0.3"/>
</svg>
